<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 팀 자가채점표 · 파이썬 시뮬레이션 프로젝트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #EEF1F4;
    color: #1B2733;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Pretendard', system-ui, sans-serif;
    padding: clamp(16px, 4vw, 40px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .eyebrow { font-size: 13px; color: #5B6B7B; font-weight: 600; }
  h1 {
    margin: 4px 0 10px; font-size: clamp(23px, 5vw, 32px);
    font-weight: 800; line-height: 1.15; letter-spacing: -0.02em;
  }
  .lead { font-size: 14.5px; color: #4A5A6A; line-height: 1.6; }
  .lead b { font-weight: 700; }

  .card {
    background: #fff; border-radius: 18px;
    padding: 22px clamp(18px, 4vw, 28px);
    box-shadow: 0 1px 3px rgba(27,39,51,.08), 0 8px 24px rgba(27,39,51,.06);
    margin-bottom: 20px;
  }
  .totalrow { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .total { display: flex; align-items: baseline; gap: 4px; }
  .total .num {
    font-size: clamp(44px, 11vw, 68px); font-weight: 800; letter-spacing: -.04em;
    color: #2540A8; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .total .den { font-size: 22px; font-weight: 700; color: #9AA7B4; }
  .count { font-size: 13px; color: #8A99A8; font-weight: 600; }

  .track { margin-top: 16px; height: 10px; border-radius: 999px; background: #E3E8ED; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#6C8CE0,#2540A8); width: 0; transition: width .35s cubic-bezier(.22,1,.36,1); }

  .blocks { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
  .block { border-radius: 12px; padding: 11px 13px; border: 1.5px solid; }
  .block .bhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .block .blabel { font-size: 12.5px; font-weight: 700; }
  .block .bscore { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .block .bscore .bmax { color: #AEB9C4; font-weight: 600; }
  .block .btrack { height: 6px; border-radius: 999px; background: #E3E8ED; overflow: hidden; }
  .block .bfill { height: 100%; border-radius: 999px; width: 0; transition: width .3s; }

  .hint { margin: 12px 2px 0; font-size: 12px; color: #8291A0; line-height: 1.5; }

  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .reset { border: none; background: transparent; color: #94A3AE; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .reset:hover { color: #64748B; }

  .items { display: flex; flex-direction: column; gap: 12px; }
  .item {
    background: #fff; border-radius: 14px; padding: 16px clamp(14px,3vw,20px);
    box-shadow: 0 1px 2px rgba(27,39,51,.06);
    border-left: 4px solid #E3E8ED; transition: border-color .2s;
  }
  .ihead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .ihead h2 { font-size: 15.5px; font-weight: 700; line-height: 1.3; }
  .ihead .idnum { color: #A6B2BD; margin-right: 7px; font-weight: 800; }
  .badge { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }

  .note { margin: 0 0 12px; font-size: 12.5px; line-height: 1.55; color: #6B7B8B; background: #F4F6F8; padding: 9px 11px; border-radius: 9px; }
  .grouplabel { margin: 9px 0 1px; font-size: 12.5px; font-weight: 700; color: #40515F; }
  .grouplabel.first { margin-top: 0; }

  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt {
    display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
    border: 1.5px solid #E7EBEF; background: #FBFCFD; border-radius: 10px;
    padding: 11px 12px; cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .opt:hover { border-color: #CBD4DD; }
  .radio { flex-shrink: 0; width: 17px; height: 17px; border-radius: 50%; border: 2px solid #C3CDD6; transition: all .15s; }
  .opt .score { flex-shrink: 0; min-width: 26px; font-size: 15px; font-weight: 800; color: #93A2B0; font-variant-numeric: tabular-nums; }
  .opt .otext { font-size: 13.5px; line-height: 1.45; color: #5A6976; }

  .advice { margin-top: 18px; border-radius: 14px; padding: 16px 18px; border: 1.5px solid; display: none; }
  .advice .atitle { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
  .advice .abody { font-size: 13.5px; line-height: 1.6; color: #40515F; }

  footer {
    margin-top: 22px; padding: 14px 16px; background: #E7ECF1; border-radius: 12px;
    font-size: 12.5px; color: #5E6E7C; line-height: 1.6;
  }
  footer b { font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">파이썬 시뮬레이션 프로젝트</p>
    <h1>우리 팀 자가채점표</h1>
    <p class="lead">항목마다 <b>나에게 해당하는 칸</b>을 정직하게 고르면 예상 점수가 바로 계산됩니다.</p>
  </header>

  <section class="card">
    <div class="totalrow">
      <div class="total"><span class="num" id="total">0</span><span class="den">/ 100</span></div>
      <span class="count" id="count">0 / 6 항목 선택됨</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="blocks" id="blocks"></div>
    <p class="hint">완성 못 해도 <b style="color:#B45309">유의미성 25점</b>과 <b style="color:#047857">수준·기여 30점</b>은 지킬 수 있어요.</p>
  </section>

  <div class="toolbar"><button class="reset" id="reset">초기화</button></div>

  <div class="items" id="items"></div>

  <div class="advice" id="advice">
    <p class="atitle" id="advice-title"></p>
    <p class="abody" id="advice-body"></p>
  </div>

  <footer>
    이 표는 스스로 점검하는 <b>예상 점수</b>입니다. 최종 점수는 선생님이 활동지와 프로그램을 확인해 확정합니다.
  </footer>
</div>

<script>
// ── 데이터 ────────────────────────────────────────────────
const BLOCKS = {
  done:    { label: "완성도",   color: "#2540A8", max: 45 },
  meaning: { label: "유의미성", color: "#B45309", max: 25 },
  level:   { label: "수준 및 기여", color: "#047857", max: 30 },
};

const CRITERIA = [
  { id:"①", block:"done", name:"주제별 프로그램 구현", weight:15, options:[
    {score:15, text:"3개 주제 모두 오류 없이 완성"},
    {score:12, text:"2개 완성 (또는 3개 중 1개만 경미한 오류)"},
    {score:9,  text:"1개 완성, 또는 여러 개가 부분만 동작"},
    {score:6,  text:"작성했으나 핵심 기능 대부분 미동작"},
  ]},
  { id:"②", block:"meaning", name:"문제 인식 및 기획", weight:10, options:[
    {score:10, text:"필요성 근거 + 입력→처리→출력 흐름 설계"},
    {score:7,  text:"무엇을 할지는 적었으나 근거·흐름 부족"},
    {score:4,  text:"목적 불분명, 기획 내용 거의 없음"},
  ]},
  { id:"③", block:"meaning", name:"핵심 변수 및 조건식 설계", weight:15, options:[
    {score:15, text:"변수 역할·초기값 정의 + 변수 관계 수식화"},
    {score:11, text:"변수 정리했으나 일부 누락·관계 불분명"},
    {score:7,  text:"변수 정리가 거의 없음"},
  ]},
  { id:"④", block:"done", name:"알고리즘 논리적 구현", weight:20, options:[
    {score:20, text:"끝까지 완벽 실행, 이상한 입력에도 안전"},
    {score:14, text:"실행되나 예외 상황서 오류·처리 부족"},
    {score:8,  text:"핵심 연산이 오류로 실행 안 됨"},
  ]},
  { id:"⑤", block:"done", name:"결과 출력 및 시각화", weight:10, options:[
    {score:10, text:"결과 + 변화 과정까지 한눈에 보임"},
    {score:7,  text:"결과 출력됨 (미완성이어도 일부 과정 표시)"},
    {score:4,  text:"출력이 거의 안 됨"},
  ]},
  { id:"⑥", block:"level", name:"프로그램 난이도 · 성찰 및 협력", weight:30,
    note:"프로그램 수준과 내 기여를 조합해 점수가 정해집니다. 상 수준이라도 내 기여가 낮으면 점수가 내려가요. 해당하는 한 칸을 고르세요.",
    options:[
      {score:30, groupLabel:"프로그램 상 수준", text:"내 역할·성찰 모두 충실"},
      {score:27, text:"내 역할·성찰 보통"},
      {score:24, text:"내 역할·성찰 부족"},
      {score:22, groupLabel:"프로그램 중 수준", text:"내 역할·성찰 모두 충실"},
      {score:20, text:"내 역할·성찰 보통"},
      {score:18, text:"내 역할·성찰 부족"},
      {score:16, groupLabel:"프로그램 하 수준", text:"내 역할·성찰 충실히 함"},
      {score:14, text:"내 역할·성찰 부족"},
    ]},
];

const TOTAL = 100;
const picks = {}; // id -> option index
CRITERIA.forEach(c => picks[c.id] = null);

// ── 유틸: 색 투명도 붙이기 ────────────────────────────────
function tint(hex, a){ return hex + a; } // hex like #RRGGBB, a like "12"

// ── 블록 카드 렌더 ────────────────────────────────────────
function renderBlocks(){
  const el = document.getElementById('blocks');
  el.innerHTML = '';
  Object.entries(BLOCKS).forEach(([key,b])=>{
    const div = document.createElement('div');
    div.className = 'block';
    div.style.borderColor = tint(b.color,'22');
    div.style.background = tint(b.color,'0A');
    div.innerHTML =
      '<div class="bhead">'+
        '<span class="blabel" style="color:'+b.color+'">'+b.label+'</span>'+
        '<span class="bscore" id="bscore-'+key+'" style="color:'+b.color+'">0<span class="bmax"> / '+b.max+'</span></span>'+
      '</div>'+
      '<div class="btrack"><div class="bfill" id="bfill-'+key+'" style="background:'+b.color+'"></div></div>';
    el.appendChild(div);
  });
}

// ── 항목 렌더 ─────────────────────────────────────────────
function renderItems(){
  const wrap = document.getElementById('items');
  wrap.innerHTML = '';
  CRITERIA.forEach(c=>{
    const b = BLOCKS[c.block];
    const item = document.createElement('section');
    item.className = 'item';
    item.id = 'item-'+c.id;

    let html =
      '<div class="ihead">'+
        '<h2><span class="idnum">'+c.id+'</span>'+c.name+'</h2>'+
        '<span class="badge" style="color:'+b.color+';background:'+tint(b.color,'12')+'">'+b.label+' · '+c.weight+'점</span>'+
      '</div>';

    if(c.note){ html += '<p class="note">'+c.note+'</p>'; }

    html += '<div class="opts">';
    c.options.forEach((opt,oi)=>{
      if(opt.groupLabel){
        html += '<p class="grouplabel'+(oi===0?' first':'')+'">'+opt.groupLabel+'</p>';
      }
      html +=
        '<button class="opt" data-id="'+c.id+'" data-idx="'+oi+'">'+
          '<span class="radio"></span>'+
          '<span class="score">'+opt.score+'</span>'+
          '<span class="otext">'+opt.text+'</span>'+
        '</button>';
    });
    html += '</div>';
    item.innerHTML = html;
    wrap.appendChild(item);
  });

  // 이벤트 연결
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-id');
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      picks[id] = (picks[id]===idx) ? null : idx;
      update();
    });
  });
}

// ── 점수 계산 + 화면 갱신 ─────────────────────────────────
function scoreOf(c){ return picks[c.id]===null ? 0 : c.options[picks[c.id]].score; }

function update(){
  let total = 0;
  const bs = { done:0, meaning:0, level:0 };
  CRITERIA.forEach(c=>{ const s=scoreOf(c); total+=s; bs[c.block]+=s; });

  document.getElementById('total').textContent = total;
  document.getElementById('fill').style.width = Math.min(100, total/TOTAL*100)+'%';

  const chosen = Object.values(picks).filter(v=>v!==null).length;
  document.getElementById('count').textContent = chosen+' / '+CRITERIA.length+' 항목 선택됨';

  Object.entries(BLOCKS).forEach(([key,b])=>{
    document.getElementById('bscore-'+key).innerHTML = bs[key]+'<span class="bmax"> / '+b.max+'</span>';
    document.getElementById('bfill-'+key).style.width = (bs[key]/b.max*100)+'%';
  });

  // 항목별 선택 표시
  CRITERIA.forEach(c=>{
    const b = BLOCKS[c.block];
    const item = document.getElementById('item-'+c.id);
    item.style.borderLeftColor = picks[c.id]!==null ? b.color : '#E3E8ED';
    item.querySelectorAll('.opt').forEach(btn=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const on = picks[c.id]===idx;
      btn.style.border = on ? '1.5px solid '+b.color : '1.5px solid #E7EBEF';
      btn.style.background = on ? tint(b.color,'0C') : '#FBFCFD';
      btn.querySelector('.radio').style.border = on ? '5px solid '+b.color : '2px solid #C3CDD6';
      btn.querySelector('.score').style.color = on ? b.color : '#93A2B0';
      btn.querySelector('.otext').style.color = on ? '#33414F' : '#5A6976';
    });
  });

  renderAdvice(bs, chosen===CRITERIA.length);
}

// ── 맞춤 조언 ─────────────────────────────────────────────
function renderAdvice(bs, all){
  const box = document.getElementById('advice');
  if(!all){ box.style.display='none'; return; }
  const {done, meaning, level} = bs;
  let a;
  if(level < 18){
    a = {tone:'#BE123C', title:'수준·기여 점수가 낮아요',
      body:'더 도전적인 주제를 다루거나, 내가 맡은 역할과 배운 점을 분명히 드러내면 점수가 오릅니다. 상 수준이라도 기여가 적으면 점수가 내려간다는 점을 기억하세요.'};
  } else if(done < 27 && meaning >= 16 && level >= 22){
    a = {tone:'#B45309', title:'도전형 — 완성은 아쉽지만 잘 지켰어요',
      body:'완성 점수는 낮지만 기획·설계와 수준·기여로 점수를 방어했습니다. 어려운 주제를 시도하다 막혀도 손해가 아닙니다.'};
  } else if(meaning < 16){
    a = {tone:'#B45309', title:'기획·설계를 보강하세요',
      body:'② 기획과 ③ 설계는 프로그램이 안 돌아가도 인정되는 25점입니다. 필요성 근거와 변수 설계를 채우면 방어 점수가 커집니다.'};
  } else {
    a = {tone:'#047857', title:'탄탄합니다',
      body:'세 영역이 고르게 채워졌어요. 이 표는 예상 점수이고, 최종 점수는 선생님이 확정합니다.'};
  }
  box.style.display = 'block';
  box.style.background = tint(a.tone,'0D');
  box.style.borderColor = tint(a.tone,'33');
  const t = document.getElementById('advice-title');
  t.textContent = a.title; t.style.color = a.tone;
  document.getElementById('advice-body').textContent = a.body;
}

// ── 초기화 버튼 ───────────────────────────────────────────
document.getElementById('reset').addEventListener('click', ()=>{
  CRITERIA.forEach(c=> picks[c.id]=null);
  update();
});

// ── 시작 ──────────────────────────────────────────────────
renderBlocks();
renderItems();
update();
</script>
</body>
</html>
